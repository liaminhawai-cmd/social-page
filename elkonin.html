<script>
/* shared by every tool. Inlined by tools/build.py — do not load from a CDN. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wordsOf = id => D.words[id];
const flat = id => D.words[id].parts.flat();
function unitById(id) { return D.units.find(u => u.id === id) || D.units[0]; }
function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayNum(k) { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }

/* ---- storage: this device only. Falls back to memory if the browser blocks it. ---- */
const Store = (() => {
  const KEY = 'sharing-tools-v1'; let mem = null;
  function load() {
    if (mem) return mem;
    try { const s = localStorage.getItem(KEY); mem = s ? JSON.parse(s) : null; } catch (e) { mem = null; }
    if (!mem || mem.v !== 1) mem = { v: 1, items: {}, log: [], secs: {} };
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* blocked: stays in memory */ } }
  function reset() { mem = { v: 1, items: {}, log: [], secs: {} }; save(); }
  return { get: load, save, reset };
})();

/* ---- time-gated review: five boxes, whole-day gaps. Gates promotion, never access. ----
   Box n means: answered first time correct after at least DUE[n-1] days since the last promotion. */
const DUE = [0, 0, 1, 3, 7, 21];   // index = box the item is currently in
function itemKey(tool, id) { return tool + '|' + id; }
function itemState(tool, id) { return Store.get().items[itemKey(tool, id)] || { box: 0, last: null }; }
function isDue(tool, id) {
  const s = itemState(tool, id); if (!s.last) return true;
  const gap = Math.max(0, dayNum(dayKey()) - dayNum(s.last));
  return s.box < 5 && gap >= DUE[s.box];
}
function recordFirstTry(tool, id, ok, extra) {
  const st = Store.get(), k = itemKey(tool, id), today = dayKey();
  let s = st.items[k] || { box: 0, last: null };
  if (!ok) { s = { box: 1, last: today }; }
  else if (!s.last) { s = { box: 1, last: today }; }
  else {
    const gap = Math.max(0, dayNum(today) - dayNum(s.last));
    if (s.box < 5 && gap >= DUE[s.box]) s = { box: s.box + 1, last: today };   // else: accepted, not promoted, clock not reset
  }
  st.items[k] = s;
  st.log.push(Object.assign({ d: today, t: Date.now(), tool, id, ok: !!ok }, extra || {}));
  if (st.log.length > 1500) st.log.splice(0, st.log.length - 1500);
  Store.save();
}
function dots(tool, id) { const b = itemState(tool, id).box; return '●'.repeat(b) + '○'.repeat(5 - b); }

/* ---- time on task: seconds with real activity, per day / tool / unit ---- */
const Clock = (() => {
  let last = 0, ctx = { tool: '', unit: '' };
  function poke() { last = Date.now(); }
  ['pointerdown', 'keydown', 'input'].forEach(ev => addEventListener(ev, poke, true));
  setInterval(() => {
    if (document.hidden || Date.now() - last > 20000 || !ctx.tool) return;
    const st = Store.get(), k = dayKey() + '|' + ctx.tool + '|' + ctx.unit;
    st.secs[k] = (st.secs[k] || 0) + 5; Store.save();
  }, 5000);
  return { set(t, u) { ctx = { tool: t, unit: u }; } };
})();

/* ---- speech: the browser's own voice. It can be wrong; the human overrules it. ---- */
const Say = (() => {
  const ok = 'speechSynthesis' in window;
  function pick(langs) {
    const vs = ok ? speechSynthesis.getVoices() : [];
    for (const l of langs) { const v = vs.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(l.toLowerCase())); if (v) return v; }
    return null;
  }
  function en(text) {
    if (!ok) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); const v = pick(['en-AU', 'en-GB', 'en']);
    if (v) u.voice = v; u.lang = v ? v.lang : 'en-AU'; u.rate = 0.8; speechSynthesis.speak(u);
  }
  function zh(text) {
    if (!ok) return; const v = pick(['zh-HK', 'yue', 'zh-TW', 'zh']); if (!v) return;
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = 0.85; speechSynthesis.speak(u);
  }
  return { en, zh, canEn: () => ok, canZh: () => !!pick(['zh-HK', 'yue', 'zh-TW', 'zh']) };
})();
function speakBtn(text, label) {
  if (!Say.canEn()) return null;
  return h('button', { class: 'btn sp', type: 'button', 'aria-label': label || 'Hear it', title: 'Computer voice — it can get a sound wrong',
    onclick: e => { e.stopPropagation(); Say.en(text); } }, '🔊');
}

/* ---- clipboard ---- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = h('textarea', { style: 'position:fixed;left:-999px' }); ta.value = t; document.body.append(ta); ta.select();
    let r = false; try { r = document.execCommand('copy'); } catch (e2) {} ta.remove(); return r;
  }
}

/* ---- report: first tries only, misses named, time on task. ---- */
function buildReport(tool, toolLabel, days) {
  const st = Store.get(), today = dayNum(dayKey());
  const recent = st.log.filter(e => e.tool === tool && today - dayNum(e.d) < days);
  const groups = {};
  for (const e of recent) { const k = e.d + '|' + (e.unit || '') + '|' + (e.mode || ''); (groups[k] = groups[k] || []).push(e); }
  const keys = Object.keys(groups).sort().reverse();
  const lines = [], rows = [], timeShown = {};
  lines.push(toolLabel + ' — first tries only, last ' + days + ' days');
  if (!keys.length) lines.push('', 'No first tries recorded on this device yet.');
  for (const k of keys) {
    const [d, unit, mode] = k.split('|'), es = groups[k], right = es.filter(e => e.ok).length;
    const missed = es.filter(e => !e.ok).map(e => e.id + (e.why ? ' (' + e.why + ')' : ''));
    const tk = d + '|' + unit, secs = st.secs[d + '|' + tool + '|' + unit] || 0, mins = Math.round(secs / 60);
    const timeLine = timeShown[tk] ? '' : '  time on task that day (all clues): ' + mins + ' min'; timeShown[tk] = 1;
    const u = D.units.find(x => x.id === unit);
    lines.push('', d + '  ' + (u ? u.title : unit) + (mode ? '  [' + mode + ']' : ''),
      '  first try right: ' + right + ' of ' + es.length + (missed.length ? '' : ''),
      '  missed: ' + (missed.length ? missed.join('; ') : 'none'),
      ...(timeLine ? [timeLine] : []));
    rows.push([d, u ? u.title : unit, mode || '', right, es.length, missed.join('; '), timeLine ? mins : ''].join('\t'));
  }
  lines.push('', 'Review dots (●●●○○) count right-first-time answers on separate days, after gaps of 1, 3, 7 and 21 days. Five dots = right first time after a gap of 21 days or more.');
  lines.push('This record cannot show: whether anyone helped, whether the sounds were said aloud, or whether a right answer was understood.');
  return { text: lines.join('\n'), tsv: rows.join('\n') };
}
function reportDialog(tool, toolLabel) {
  const pre = h('pre'), msg = h('span', { class: 'small', 'aria-live': 'polite' });
  const rep = () => buildReport(tool, toolLabel, 14);
  const veil = h('div', { class: 'veil', hidden: true, role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Report' },
    h('div', { class: 'dlg' },
      h('header', {}, h('h2', { text: 'Report' }), h('button', { class: 'btn', type: 'button', onclick: () => veil.hidden = true }, 'Close')),
      pre,
      h('footer', {},
        h('button', { class: 'btn pri', type: 'button', onclick: async () => { msg.textContent = (await copyText(rep().text)) ? 'Text copied.' : 'Copy failed — select the text and copy it.'; } }, 'Copy text'),
        h('button', { class: 'btn', type: 'button', onclick: async () => { msg.textContent = (await copyText(rep().tsv)) ? 'Rows copied (tab-separated, one row per day and clue).' : 'Copy failed.'; } }, 'Copy rows'),
        h('button', { class: 'btn', type: 'button', onclick: () => { if (confirm('Delete everything saved on this device for these tools?')) { Store.reset(); pre.textContent = rep().text; msg.textContent = 'Deleted.'; } } }, 'Delete record'),
        h('span', { class: 'small' }, 'Saved on this device only. Nothing is sent anywhere.'), msg)));
  document.body.append(veil);
  addEventListener('keydown', e => { if (e.key === 'Escape') veil.hidden = true; });
  return { open() { pre.textContent = rep().text; msg.textContent = ''; veil.hidden = false; $('.btn', veil).focus(); } };
}

/* ---- teacher lock. A link with lock=1 pins this tool's options on this device (the child cannot
   switch the clue back on); it stays pinned until the teacher page unlocks it. It hides switches:
   it is not security — clearing the browser's site data removes it. ---- */
const Lock = (() => {
  const KEY = 'sharing-tools-lock-v1';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const write = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
  function params() {
    const p = new URLSearchParams(location.search);
    new URLSearchParams(location.hash.slice(1)).forEach((v, k) => p.set(k, v));
    return p;
  }
  function config(tool) {
    const p = params(), all = read();
    if (p.get('lock') === '1') {
      const o = {}; p.forEach((v, k) => { if (k !== 'lock') o[k] = v; });
      all[tool] = o; write(all);
      history.replaceState(null, '', location.pathname);       // the address bar no longer shows the settings
    }
    if (all[tool]) {
      document.documentElement.classList.add('locked');
      return { locked: true, get: k => (k in all[tool] ? all[tool][k] : null) };
    }
    return { locked: false, get: k => p.get(k) };
  }
  return { config, all: read, clear(tool) { const a = read(); if (tool) delete a[tool]; else Object.keys(a).forEach(k => delete a[k]); write(a); } };
})();

</script>
<script>
'use strict';
const TOOL = 'boxes';
const MODES = [
  { id: 'word',    label: 'Word shown',   tiles: true },
  { id: 'zh',      label: 'Chinese only', tiles: false },
  { id: 'meaning', label: 'Meaning',      tiles: false },
  { id: 'sound',   label: 'Sound only',   tiles: false }
];
const cfg = Lock.config(TOOL);
let unit = unitById(cfg.get('unit')), mode = MODES.find(m => m.id === cfg.get('clue')) || MODES[0];
let tilesOn = cfg.get('tiles') == null ? mode.tiles : cfg.get('tiles') === '1', cur = null;
const showOn = cfg.get('show') !== '0';
const memo = {};   // per unit+mode+word: { vals, tries, state, seen }

const sheet = $('#sheet'), statusEl = $('#status'), tray = $('#tray'), tilesEl = $('#tiles');
const report = reportDialog(TOOL, 'Sound boxes');

function rowMem(id) {
  const k = unit.id + '|' + mode.id + '|' + id;
  return memo[k] || (memo[k] = { vals: flat2(id).map(() => ''), tries: 0, state: 'idle', seen: false, marks: [] });
}
function flat2(id) { return D.words[id].parts.flat(); }
function say(html) { statusEl.innerHTML = html; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function clueCell(id, n) {
  const w = D.words[id], c = h('div', { class: 'clue' });
  if (mode.id === 'word') c.append(h('div', { class: 'ic emo' }, w.icon), h('div', { class: 'en' }, id), h('div', { class: 'cn zh', lang: 'zh-HK' }, w.zh));
  else if (mode.id === 'zh') c.append(h('div', { class: 'ic emo' }, w.icon), h('div', { class: 'cn zh', lang: 'zh-HK' }, w.zh));
  else if (mode.id === 'meaning') c.append(h('div', { class: 'df' }, w.def), h('div', { class: 'cn zh', lang: 'zh-HK' }, w.zh));
  else c.append(...[h('div', { class: 'num' }, String(n)), speakBtn(id, 'Hear word ' + n)].filter(Boolean));
  return c;
}

function buildRow(id, n) {
  const w = D.words[id], mem = rowMem(id), boxes = h('div', { class: 'boxes', role: 'group', 'aria-label': 'Sound boxes, row ' + n });
  let i = 0;
  w.parts.forEach((part, pi) => {
    if (pi) boxes.append(h('span', { class: 'gap' }));
    part.forEach(() => {
      const idx = i++;
      const inp = h('input', { type: 'text', maxlength: '4', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
        'aria-label': 'Row ' + n + ', sound box ' + (idx + 1) + ' of ' + w.parts.flat().length, 'data-i': idx });
      inp.value = mem.vals[idx] || '';
      inp.addEventListener('focus', () => { cur = { id, idx }; setActive(id); });
      inp.addEventListener('input', () => {
        inp.value = inp.value.toLowerCase().replace(/[^a-z]/g, ''); mem.vals[idx] = inp.value;
        mem.marks[idx] = ''; paintMarks(id);   // editing a box clears only that box's mark
      });
      inp.addEventListener('keydown', e => boxKey(e, id, idx));
      boxes.append(h('span', { class: 'bx', 'data-i': idx }, inp, h('i', { class: 'mk', 'aria-hidden': 'true' })));
    });
  });
  const lv = h('span', { class: 'lvl', title: 'Review box: answered right first time over days' });
  const acts = h('div', { class: 'acts' },
    h('button', { class: 'btn pri', type: 'button', onclick: () => check(id) }, 'Check'),
    showOn ? h('button', { class: 'btn', type: 'button', onclick: () => show(id) }, 'Show') : null,
    h('button', { class: 'btn', type: 'button', onclick: () => clearRow(id) }, 'Clear'), lv);
  const row = h('div', { class: 'row', 'data-id': id }, clueCell(id, n), boxes, acts);
  row.addEventListener('pointerdown', () => setActive(id));
  return row;
}

function rowEl(id) { return $('.row[data-id="' + CSS.escape(id) + '"]', sheet); }
function inputs(id) { return $$('input', rowEl(id)); }
function setActive(id) {
  $$('.row', sheet).forEach(r => r.classList.toggle('active', r.dataset.id === id));
  if (!cur || cur.id !== id) cur = { id, idx: 0 };
}
function paintMarks(id) {
  const mem = rowMem(id), row = rowEl(id); if (!row) return;
  $$('.bx', row).forEach((b, i) => {
    const m = mem.marks[i] || ''; b.classList.remove('ok', 'bad', 'shown');
    const mk = $('.mk', b); mk.textContent = '';
    if (m) { b.classList.add(m); mk.textContent = m === 'ok' ? '✓' : m === 'bad' ? '✗' : ''; }
  });
  const lv = $('.lvl', row); lv.textContent = dots(TOOL, mode.id + ':' + id);
  const due = isDue(TOOL, mode.id + ':' + id), old = $('.due', row);
  if (due && !old) $('.acts', row).append(h('span', { class: 'due', title: 'Not practised for long enough, or not yet' }, 'due'));
  if (!due && old) old.remove();
}
function focusBox(id, idx) { const ins = inputs(id); const t = ins[Math.max(0, Math.min(ins.length - 1, idx))]; if (t) { t.focus(); t.select(); } }

function boxKey(e, id, idx) {
  const mem = rowMem(id), n = flat2(id).length;
  if (e.key === 'Enter') { e.preventDefault(); if (idx < n - 1) focusBox(id, idx + 1); else check(id); }
  else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) { e.preventDefault(); focusBox(id, idx + 1); }
  else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) { e.preventDefault(); focusBox(id, idx - 1); }
  else if (e.key === 'Backspace' && !e.target.value) { e.preventDefault(); focusBox(id, idx - 1); }
  else if (e.key === ' ') { e.preventDefault(); focusBox(id, idx + 1); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const ids = unit.words, k = ids.indexOf(id) + (e.key === 'ArrowDown' ? 1 : -1);
    if (ids[k]) { setActive(ids[k]); focusBox(ids[k], Math.min(idx, flat2(ids[k]).length - 1)); }
  }
}

/* ---- judge: evaluate every box; never block an attempt ---- */
function check(id) {
  const w = D.words[id], mem = rowMem(id), exp = flat2(id), ins = inputs(id);
  mem.vals = ins.map(i => i.value.trim().toLowerCase());
  const okAt = exp.map((g, i) => mem.vals[i] === g), all = okAt.every(Boolean);
  mem.tries++;
  mem.marks = okAt.map(v => v ? 'ok' : 'bad');
  const wrong = okAt.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const why = wrong.map(i => (D.tips[exp[i]] || {}).kind).filter(Boolean)[0] || (wrong.length ? 'single sound' : '');
  if (mem.tries === 1 && !mem.seen) recordFirstTry(TOOL, mode.id + ':' + id, all, { unit: unit.id, mode: mode.label, id, why: all ? '' : why });
  mem.state = all ? 'right' : 'wrong';
  paintMarks(id);
  const parts = w.parts.map(p => p.join(' · ')).join('  /  ');
  const tipsFor = list => [...new Set(list.map(g => (D.tips[g] || {}).tip).filter(Boolean))];
  if (all) {
    const t = tipsFor(exp).concat(w.tip ? [w.tip] : []);
    say('<b>✓ ' + esc(id) + '</b> &nbsp; ' + esc(parts) + (t.length ? '<br><span class="tag">' + t.map(esc).join(' ') + '</span>' : ''));
  } else {
    const empties = wrong.filter(i => !mem.vals[i]).map(i => i + 1);
    const joined = mem.vals.join(''), target = exp.join('');
    let msg;
    if (joined === target) {
      msg = '<b>The letters spell ' + esc(id) + ', but the sounds are grouped differently.</b> Boxes ' + wrong.map(i => i + 1).join(', ') + ' are not right. Some sounds use two or three letters in one box.';
    } else {
      msg = '<b>Not right: box' + (wrong.length > 1 ? 'es ' : ' ') + wrong.map(i => i + 1).join(', ') + '.</b>';
      if (empties.length) msg += ' Empty: ' + empties.join(', ') + '.';
      if (mem.tries === 1 || !showOn) {          // no Show button = no answer on later tries either
        const kinds = wrong.filter(i => mem.vals[i]).map(i => 'Box ' + (i + 1) + ' is a ' + ((D.tips[exp[i]] || {}).kind || 'single-letter sound')).filter((v, i, a) => a.indexOf(v) === i);
        if (kinds.length) msg += ' <span class="tag">' + esc(kinds.join('; ')) + '.</span>';
      } else {
        const t = wrong.map(i => '<b>' + esc(exp[i]) + '</b> in box ' + (i + 1) + (D.tips[exp[i]] ? ' — ' + esc(D.tips[exp[i]].tip) : '')).join('<br>');
        msg += '<br>' + t + (w.tip && wrong.some(i => i >= 0) ? '<br><span class="tag">' + esc(w.tip) + '</span>' : '');
      }
    }
    say(msg);
    focusBox(id, wrong[0]);
  }
}
function show(id) {
  const mem = rowMem(id), exp = flat2(id), ins = inputs(id);
  if (mem.tries === 0 && !mem.seen) recordFirstTry(TOOL, mode.id + ':' + id, false, { unit: unit.id, mode: mode.label, id, why: 'asked to see it' });
  mem.seen = true; mem.vals = exp.slice(); ins.forEach((inp, i) => inp.value = exp[i]); mem.marks = exp.map(() => 'shown'); mem.state = 'shown';
  paintMarks(id);
  say('<b>' + esc(id) + '</b> &nbsp; ' + esc(D.words[id].parts.map(p => p.join(' · ')).join('  /  ')) + '<br><span class="tag">Press Clear, then build it again from memory.</span>');
}
function clearRow(id) {
  const mem = rowMem(id); mem.vals = flat2(id).map(() => ''); mem.tries = 0; mem.state = 'idle'; mem.marks = [];
  inputs(id).forEach(i => i.value = ''); paintMarks(id); focusBox(id, 0); say('');
}

/* ---- tiles: every sound used in the unit, not just this word's ---- */
function buildTiles() {
  const all = [...new Set(unit.words.flatMap(flat2))].sort((a, b) => a.length - b.length || a.localeCompare(b));
  tilesEl.replaceChildren(...all.map(g => {
    const b = h('button', { class: 'tile', type: 'button', 'aria-label': 'Tile ' + g }, g);
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      if (!cur) { cur = { id: unit.words[0], idx: 0 }; setActive(cur.id); }
      const ins = inputs(cur.id), mem = rowMem(cur.id); if (!ins.length) return;
      const i = Math.min(cur.idx, ins.length - 1); ins[i].value = g; mem.vals[i] = g; mem.marks[i] = ''; paintMarks(cur.id);
      const nx = i + 1 < ins.length ? i + 1 : i; cur.idx = nx; ins[nx].focus({ preventScroll: true });
    });
    return b;
  }));
}
function applyTiles() { tray.hidden = !tilesOn; $('#tilesOn').checked = tilesOn; }

/* ---- render ---- */
function render() {
  Clock.set(TOOL, unit.id);
  sheet.replaceChildren(...unit.words.map((id, i) => buildRow(id, i + 1)),
    h('div', { class: 'nav-narrow' },
      h('button', { class: 'btn', type: 'button', onclick: () => step(-1) }, '‹ Back'),
      h('button', { class: 'btn', type: 'button', onclick: () => step(1) }, 'Next ›')));
  unit.words.forEach(paintMarks);
  setActive(cur && unit.words.includes(cur.id) ? cur.id : unit.words[0]);
  buildTiles(); applyTiles(); say('');
}
function step(d) { const ids = unit.words, i = Math.max(0, Math.min(ids.length - 1, ids.indexOf(cur.id) + d)); setActive(ids[i]); focusBox(ids[i], 0); }

/* ---- controls ---- */
const unitSel = $('#unit');
D.units.forEach(u => unitSel.append(h('option', { value: u.id }, u.title)));
unitSel.value = unit.id;
unitSel.addEventListener('change', () => { unit = unitById(unitSel.value); cur = null; render(); });
const modeBox = $('#mode');
MODES.forEach(m => modeBox.append(h('button', { type: 'button', 'data-m': m.id, 'aria-pressed': String(m.id === mode.id), onclick: () => {
  mode = m; tilesOn = m.tiles; $$('button', modeBox).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m.id))); render();
} }, m.label)));
$('#tilesOn').addEventListener('change', e => { tilesOn = e.target.checked; applyTiles(); });
$('#rep').addEventListener('click', () => report.open());
$('#print').addEventListener('click', () => { document.body.classList.add('printing-blank'); print(); document.body.classList.remove('printing-blank'); });
render();
</script>
