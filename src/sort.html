<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<!-- GENERATED by tools/build.py from src/sort.html + src/base.css + src/core.js + data/units.json.
     Edit those, not this file. -->
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort rhymes</title>
<style>
{{BASE_CSS}}
.board { display:flex; flex-direction:column; gap:12px; max-width:1100px; margin:0 auto; }
.bins { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.bin { background:var(--card); border:2px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-width:0; }
.bin.target, .bank.target { border-color:var(--accent); border-style:dashed; }
.bin.over, .bank.over { border-color:var(--accent); border-style:solid; background:var(--clue); }
.bhead { display:flex; align-items:center; gap:4px 10px; flex-wrap:wrap; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--clue); border-radius:10px 10px 0 0; }
.bhead .lbl { flex-basis:100%; font-size:.8rem; color:var(--muted); }
.bhead .ic { font-size:1.8rem; line-height:1; }
.bhead .en { font-size:1.3rem; font-weight:700; }
.bhead .cn { font-size:1.05rem; }
.drop { display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:10px; min-height:132px; flex:1; }
.bank { background:var(--card); border:2px dashed var(--line); border-radius:12px; padding:8px 10px 10px; }
.bank h2 { margin:0 0 6px; font-size:.85rem; color:var(--muted); font-weight:600; }
.bankcards { display:flex; flex-wrap:wrap; gap:8px; min-height:52px; }
.wc { display:flex; align-items:center; gap:8px; border:2px solid var(--boxink); background:var(--card); border-radius:10px; padding:2px 6px 2px 12px; min-height:48px;
  cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; position:relative; }
.wc .w { font-size:1.25rem; font-weight:700; }
.wc .g { font-weight:700; font-size:1rem; }
.wc .sp { min-height:36px; padding:0 8px; }
.wc.sel { outline:3px solid var(--focus); outline-offset:2px; background:var(--clue); }
.wc.drag { z-index:30; box-shadow:0 8px 18px rgba(0,0,0,.3); cursor:grabbing; }
.wc.ok { border-color:var(--ok); border-width:3px; cursor:default; }
.wc.ok .g { color:var(--ok); }
.wc.fixed { border-color:var(--ok); border-style:solid; border-width:3px; cursor:default; }
.wc.wrong { border-color:var(--bad); border-style:dashed; border-width:3px; }
.wc.wrong .g { color:var(--bad); }
.wc.shown { border-style:dotted; border-width:3px; font-style:italic; cursor:default; }
.msgs { display:flex; flex-direction:column; gap:3px; max-height:132px; overflow:auto; }
#need { color:var(--muted); font-size:.9rem; }
.msgs .hd { font-weight:700; }
.msgs .ln { font-size:.94rem; }
.go { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
@media screen and (max-width:720px) { .bins { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a class="home ctl" href="index.html">‹ All</a>
    <h1>Sort rhymes</h1>
    <label class="ctl">Book <select id="book"></select></label>
    <span class="grow"></span>
    <span class="lockmark" title="Set from the teacher page">🔒 set by teacher</span>
    <button class="btn ctl" id="rep" type="button">Report</button>
  </div>
  <main>
    <div class="region"><div class="board" id="board"></div></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="foot go">
      <button class="btn pri" id="check" type="button">Check</button>
      <button class="btn" id="next" type="button">New round</button>
      <span id="need" aria-live="polite"></span>
      <span>Saved on this device only.</span>
    </div>
  </main>
</div>
<script>
{{DATA}}
</script>
<script>
{{CORE_JS}}
</script>
<script>
'use strict';
const TOOL = 'sort';
/* ---- settings: change a number here, then run tools/build.py ----
   cardsPerEnding  words from each key word's family that go in the bank (2 or 3)
   nearMisses      words that rhyme with none of the key words; they stay in the bank
   missesBeforeShown  Checks a word can be wrong on before it is moved to the right place and marked shown
   cleanRoundMisses   most words missed on the first Check for a round to get the tick */
const SETTINGS = { cardsPerEnding: 2, nearMisses: 2, missesBeforeShown: 2, cleanRoundMisses: 0 };

const qs = Lock.config(TOOL);
if (qs.locked) Focus.start();      // pinned from the teacher page: keep it in full screen
let bookId = (D.books.find(b => b.id === qs.get('book')) || D.books[0]).id;
const nPer = Math.min(3, Math.max(2, parseInt(qs.get('n'), 10) || SETTINGS.cardsPerEnding));
const nNear = qs.get('near') === '0' ? 0 : SETTINGS.nearMisses;
const board = $('#board'), statusEl = $('#status'), checkBtn = $('#check');
const report = reportDialog(TOOL, 'Sort rhymes');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const say = html => statusEl.innerHTML = html;
let R = null, sel = null, refocus = null;

/* ---- building a round: three key words (one from each book when "All three books"), their rhymes, and near-misses ---- */
const bookOf = id => D.books.find(b => b.id === id);
const famsOfBook = b => D.rhymes.filter(r => b.units.includes(r.unit));
const clash = (a, b) => a.rime.endsWith(b.rime) || b.rime.endsWith(a.rime);   // -ow and -own would blur the sort
function pickFams() {
  const cur = bookOf(bookId), real = D.books.filter(b => !b.mix);
  for (let t = 0; t < 400; t++) {
    const fs = cur.mix ? real.map(b => shuffle(famsOfBook(b))[0]) : shuffle(famsOfBook(cur)).slice(0, 3);
    // two endings in the round should finish on the same letter (-ad and -old), so sorting by the last letter cannot work
    if (fs.length === 3 && fs.every((f, i) => fs.every((g, j) => i === j || !clash(f, g))) && (t > 300 || new Set(fs.map(f => f.rime.slice(-1))).size < 3)) return fs;
  }
  return shuffle(famsOfBook(cur.mix ? real[0] : cur)).slice(0, 3);
}
function newRound() {
  const fams = shuffle(pickFams()), rimes = fams.map(f => f.rime), cards = [];
  fams.forEach((f, i) => shuffle(f.words.filter(w => w !== f.key)).slice(0, nPer).forEach(w =>
    cards.push({ w, fi: i, rime: f.rime, at: 'bank', st: 'open', misses: 0, rec: false, first: null, wrong: false })));
  const seen = new Set(cards.map(c => c.w).concat(fams.map(f => f.key)));
  shuffle(fams.flatMap(f => f.near)).filter(n => !rimes.some(r => n.w.endsWith(r)) && !seen.has(n.w) && seen.add(n.w)).slice(0, nNear)
    .forEach(n => cards.push({ w: n.w, fi: null, rime: n.rime, at: 'bank', st: 'open', misses: 0, rec: false, first: null, wrong: false }));
  R = { fams, cards: shuffle(cards), checks: 0 };
  sel = null; say(''); draw();
}

/* ---- drawing ---- */
function keyHead(f) {
  const w = D.words[f.key];
  return h('div', { class: 'bhead' }, h('span', { class: 'lbl' }, 'Rhymes with'), h('span', { class: 'ic emo' }, w.icon), h('span', { class: 'en' }, f.key),
    h('span', { class: 'cn zh', lang: 'zh-HK' }, w.zh), speakBtn(f.key, 'Hear ' + f.key));
}
function cardEl(c, i) {
  const open = c.st === 'open', glyph = c.st === 'ok' ? (c.misses ? '↻' : '✓') : c.st === 'shown' ? 'shown' : c.wrong ? '✗' : '';
  const where = c.at === 'bank' ? 'in the word bank' : 'under ' + R.fams[c.at].key;
  const el = h('div', { class: 'wc' + (c.st === 'ok' ? (c.misses ? ' fixed' : ' ok') : '') + (c.st === 'shown' ? ' shown' : '') + (c.wrong ? ' wrong' : '') + (sel === i ? ' sel' : ''),
      'data-i': i, role: 'button', tabindex: open ? '0' : '-1', 'aria-pressed': open ? String(sel === i) : false,
      'aria-label': c.w + ', ' + where + (c.st === 'ok' ? (c.misses ? ', fixed' : ', right') : c.st === 'shown' ? ', shown, counted as missed' : c.wrong ? ', wrong' : '') },
    h('span', { class: 'w' }, c.w), glyph ? h('span', { class: 'g' }, glyph) : null, speakBtn(c.w, 'Hear ' + c.w));
  if (open) wire(el, i);
  return el;
}
function draw() {
  const inZone = z => R.cards.map((c, i) => [c, i]).filter(([c]) => c.at === z).map(([c, i]) => cardEl(c, i));
  const bins = R.fams.map((f, j) => {
    const el = h('div', { class: 'bin' + (sel != null ? ' target' : ''), 'data-zone': String(j), role: 'group', tabindex: '0', 'aria-label': 'Words that rhyme with ' + f.key }, keyHead(f), h('div', { class: 'drop' }, inZone(j)));
    return el;
  });
  const bank = h('div', { class: 'bank' + (sel != null ? ' target' : ''), 'data-zone': 'b', role: 'group', tabindex: '0', 'aria-label': 'Word bank' }, h('h2', {}, 'Word bank'), h('div', { class: 'bankcards' }, inZone('bank')));
  board.replaceChildren(h('div', { class: 'bins' }, bins), bank);
  $$('[data-zone]', board).forEach(z => {
    z.addEventListener('click', e => { if (sel != null && !e.target.closest('.wc')) place(sel, z.dataset.zone === 'b' ? 'bank' : +z.dataset.zone); });
    z.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === z && sel != null) { e.preventDefault(); refocus = sel; place(sel, z.dataset.zone === 'b' ? 'bank' : +z.dataset.zone); } });
  });
  const done = R.cards.every(c => c.st !== 'open');
  const inBank = R.cards.filter(c => c.st === 'open' && c.at === 'bank').length, spare = R.cards.filter(c => c.st === 'open' && c.fi == null).length;
  R.ready = inBank <= spare;          // place the words first: a Check with everything still in the bank would show which words are the near-misses
  checkBtn.disabled = done || !R.ready; $('#next').classList.toggle('pri', done);
  $('#need').textContent = done || R.ready ? '' : 'Words in the word bank: ' + inBank;
  if (refocus != null) { const el = $('[data-i="' + refocus + '"]', board); if (el) el.focus(); refocus = null; }
}

/* ---- moving a card: drag, or tap the word then tap a group (or 1, 2, 3 and B from the keyboard) ---- */
function zoneAt(ev) {
  const z = document.elementsFromPoint(ev.clientX, ev.clientY).find(x => x.dataset && x.dataset.zone != null);
  return z ? z.dataset.zone : null;
}
function hover(z) { $$('[data-zone]', board).forEach(el => el.classList.toggle('over', z != null && el.dataset.zone === z)); }
function place(i, z) {
  const c = R.cards[i]; if (c.st !== 'open') return;
  c.at = z === 'b' ? 'bank' : +z; c.wrong = false; sel = null; draw();
}
function wire(el, i) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('.sp')) return;
    const sx = e.clientX, sy = e.clientY; let moved = false;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    const mv = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true; el.classList.add('drag'); el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; hover(zoneAt(ev));
    };
    const up = ev => {
      el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
      hover(null);
      if (moved) { const z = ev.type === 'pointercancel' ? null : zoneAt(ev); el.style.transform = ''; el.classList.remove('drag'); if (z != null) place(i, z); }
      else { sel = sel === i ? null : i; draw(); }
    };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  el.addEventListener('keydown', e => {
    if (e.target.closest('.sp')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel = sel === i ? null : i; refocus = i; draw(); }
    else if (e.key === 'Escape') { sel = null; refocus = i; draw(); }
    else if (/^[1-3]$/.test(e.key) && +e.key <= R.fams.length) { refocus = i; place(i, +e.key - 1); }
    else if (e.key === 'b' || e.key === 'B' || e.key === '0') { refocus = i; place(i, 'b'); }
  });
}

/* ---- Check: place everything, then check. A word wrong twice is moved and marked shown, not credited. ---- */
function whyWrong(c) {
  const f = c.at === 'bank' ? null : R.fams[c.at];
  if (!f) return '<b>' + esc(c.w) + '</b> is still in the word bank. It ends -' + esc(c.rime) + '. Say it, then say the three key words.';
  const trap = c.w[0] === f.key[0] ? ' Starting the same does not make a rhyme.' : (c.w.slice(-1) === f.key.slice(-1) ? ' Only the last letter matches; the whole ending must match.' : '');
  return '<b>' + esc(c.w) + '</b> is under <b>' + esc(f.key) + '</b>. ' + esc(c.w) + ' ends -' + esc(c.rime) + '. ' + esc(f.key) + ' ends -' + esc(f.rime) + '. The endings are different.' + trap;
}
function check() {
  if (R.cards.every(c => c.st !== 'open') || !R.ready) return;
  R.checks++; countCheck(TOOL);
  const lines = [], shown = [];
  R.cards.forEach(c => {
    if (c.st !== 'open') return;
    const right = c.fi == null ? c.at === 'bank' : c.at === c.fi;
    if (!c.rec) {
      c.rec = true; c.first = right;
      const why = right ? '' : c.at === 'bank' ? 'left in the bank' : (c.fi == null ? 'put a near-miss with ' + R.fams[c.at].key : 'put under ' + R.fams[c.at].key + ' (ends -' + c.rime + ')');
      recordFirstTry(TOOL, 'sort:' + c.w, right, { unit: bookId, mode: 'Sort rhymes', id: c.w, why });
    }
    if (right) { c.st = 'ok'; c.wrong = false; return; }
    c.misses++;
    if (c.misses >= SETTINGS.missesBeforeShown) { c.st = 'shown'; c.wrong = false; c.at = c.fi == null ? 'bank' : c.fi; shown.push(c); }
    else { c.wrong = true; lines.push(whyWrong(c)); }
  });
  const left = R.cards.filter(c => c.st === 'open').length, right1 = R.cards.filter(c => c.first).length;
  sel = null; draw();
  const out = [];
  if (!left) {
    const missed = R.cards.filter(c => !c.first).map(c => c.w), clean = missed.length <= SETTINGS.cleanRoundMisses && R.checks === 1;
    out.push('<div class="hd">' + (clean ? '✓ Clean round: every word right on the first Check.' : 'Round finished. Right on the first Check: ' + right1 + ' of ' + R.cards.length + '.') + '</div>');
    if (missed.length) out.push('<div class="ln">Missed first: ' + missed.map(esc).join(', ') + '.</div>');
    const near = R.cards.filter(c => c.fi == null);
    if (near.length) out.push('<div class="ln">Stay in the bank: ' + near.map(c => esc(c.w) + ' (-' + esc(c.rime) + ')').join(', ') + '. They do not end like ' + R.fams.map(f => esc(f.key)).join(', ') + '.</div>');
  } else {
    out.push('<div class="hd">Check ' + R.checks + ': ' + R.cards.filter(c => c.st !== 'open').length + ' of ' + R.cards.length + ' settled. ' + left + ' to move.</div>');
  }
  lines.slice(0, 4).forEach(l => out.push('<div class="ln">✗ ' + l + '</div>'));
  if (lines.length > 4) out.push('<div class="ln">And ' + (lines.length - 4) + ' more marked ✗.</div>');
  shown.forEach(c => out.push('<div class="ln"><b>' + esc(c.w) + '</b> is shown' + (c.fi == null ? ' in the word bank: it ends -' + esc(c.rime) + ', so it rhymes with none of the key words.'
    : ' under <b>' + esc(R.fams[c.fi].key) + '</b>: both end -' + esc(c.rime) + '.') + ' Counted as missed.</div>'));
  say('<div class="msgs">' + out.join('') + '</div>');
}

/* ---- controls ---- */
const bookSel = $('#book');
D.books.forEach(b => bookSel.append(h('option', { value: b.id }, b.title)));
bookSel.value = bookId;
bookSel.addEventListener('change', () => { bookId = bookSel.value; Clock.set(TOOL, bookId); newRound(); });
checkBtn.addEventListener('click', check);
$('#next').addEventListener('click', newRound);
addEventListener('keydown', e => { if (e.key === 'Escape' && sel != null) { sel = null; draw(); } });
$('#rep').addEventListener('click', () => report.open());
Clock.set(TOOL, bookId);
newRound();
</script>
</body>
</html>
