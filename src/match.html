<style>
{{BASE_CSS}}
.cols { display:grid; grid-template-columns:1fr 1fr; gap:10px 28px; max-width:900px; margin:0 auto; }
.col { display:flex; flex-direction:column; gap:8px; }
.col h2 { margin:0; font-size:.85rem; color:var(--muted); font-weight:600; }
.card { position:relative; min-height:56px; padding:6px 14px; border:2px solid var(--boxink); border-radius:10px; background:var(--card);
  display:flex; align-items:center; gap:10px; text-align:left; width:100%; }
.card .big { font-size:1.35rem; font-weight:600; }
.card .ic { font-size:1.9rem; }
.card .cn { font-size:1.35rem; }
.card .df { font-size:.95rem; }
.card[aria-pressed="true"] { outline:4px solid var(--focus); outline-offset:1px; background:var(--clue); }
.card.done { background:var(--clue); border-color:var(--ok); border-width:3px; cursor:default; }
.card.nope { border-style:dashed; border-color:var(--bad); border-width:3px; }
.card .mk { position:absolute; right:10px; top:6px; font-weight:700; font-style:normal; }
.card.done .mk { color:var(--ok); } .card.nope .mk { color:var(--bad); }
@media (max-width:720px) { .cols { gap:8px 10px; } .card { padding:6px 8px; } .card .big,.card .cn { font-size:1.1rem; } }

<body>
<div class="app">

    <div class="seg" role="group" aria-label="Match the word to" id="kind"></div>
    <span class="grow"></span>
    <button class="btn" id="next" type="button">New round</button>
    <button class="btn" id="rep" type="button">Report</button>
  </div>
  <main>
    <div class="region"><div class="cols" id="cols"></div></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="foot">Two cards in the right-hand column belong to words that are not in this round. Saved on this device only.</div>
  </main>
</div>

{{DATA}}

<script>

<script>
'use strict';
const TOOL = 'match';
const KINDS = [{ id: 'zh', label: '中文' }, { id: 'pic', label: 'Picture' }, { id: 'def', label: 'Meaning' }];
const qs = new URLSearchParams(location.search);
let unit = unitById(qs.get('unit')), kind = KINDS.find(k => k.id === qs.get('kind')) || KINDS[0];
let roundNo = 0, round = [], left = [], right = [], sel = null, done = {}, tried = {};
const colsEl = $('#cols'), statusEl = $('#status'), report = reportDialog(TOOL, 'Match words');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const say = html => statusEl.innerHTML = html;

function groups() {
  const ids = shuffle(unit.words.filter((w, i, a) => a.indexOf(w) === i)), n = Math.ceil(ids.length / 6), size = Math.ceil(ids.length / n), out = [];
  for (let i = 0; i < ids.length; i += size) out.push(ids.slice(i, i + size));
  return out;
}
let allRounds = groups();
function setRound(i) {
  roundNo = i % allRounds.length; round = allRounds[roundNo];
  const pool = shuffle(Object.keys(D.words).filter(w => !round.includes(w)));
  const sameUnit = pool.filter(w => unit.words.includes(w)), others = pool.filter(w => !unit.words.includes(w));
  const decoys = shuffle(sameUnit.concat(others)).slice(0, 2);
  left = shuffle(round); right = shuffle(round.concat(decoys));
  sel = null; done = {}; tried = {};
  Clock.set(TOOL, unit.id); draw(); say('');
}
function meaningCard(id) {
  const w = D.words[id];
  if (kind.id === 'zh') return h('span', { class: 'cn zh', lang: 'zh-HK' }, w.zh);
  if (kind.id === 'pic') return h('span', { class: 'ic emo', 'aria-label': 'picture' }, w.icon);
  return h('span', { class: 'df' }, w.def);
}
function describe(id) {
  const w = D.words[id];
  return kind.id === 'zh' ? '<span class="zh" lang="zh-HK">' + esc(w.zh) + '</span>' : kind.id === 'pic' ? '<span class="emo">' + esc(w.icon) + '</span>' : '“' + esc(w.def) + '”';
}
function draw() {
  const L = h('div', { class: 'col' }, h('h2', {}, 'Word' + (allRounds.length > 1 ? ' — round ' + (roundNo + 1) + ' of ' + allRounds.length : '')));
  const R = h('div', { class: 'col' }, h('h2', {}, kind.id === 'zh' ? '中文' : kind.id === 'pic' ? 'Picture' : 'Meaning'));
  left.forEach(id => {
    const b = h('button', { class: 'card' + (done[id] ? ' done' : ''), type: 'button', 'data-w': id, 'aria-pressed': String(sel === id),
      onclick: () => pickWord(id) }, h('span', { class: 'big' }, id), h('i', { class: 'mk', 'aria-hidden': 'true' }, done[id] ? '✓ ' + done[id] : ''));
    if (done[id]) b.disabled = true; L.append(b);
  });
  right.forEach(id => {
    const doneBy = Object.keys(done).find(k => k === id);
    const b = h('button', { class: 'card' + (doneBy ? ' done' : ''), type: 'button', 'data-m': id, onclick: () => pickMeaning(id) },
      meaningCard(id), h('i', { class: 'mk', 'aria-hidden': 'true' }, doneBy ? '✓ ' + done[id] : ''));
    if (doneBy) b.disabled = true; R.append(b);
  });
  colsEl.replaceChildren(L, R);
  if (sel) { const b = $('[data-w="' + CSS.escape(sel) + '"]', colsEl); if (b) b.focus({ preventScroll: true }); }
}
let pairNo = 0;
function pickWord(id) { if (done[id]) return; sel = id; if (Say.canEn()) Say.en(id); draw(); say('<b>' + esc(id) + '</b> — now choose its ' + (kind.id === 'zh' ? '中文' : kind.id === 'pic' ? 'picture' : 'meaning') + '.'); }
function pickMeaning(m) {
  if (!sel) { say('Choose a word on the left first.'); return; }
  const w = sel, ok = m === w;
  if (!tried[w]) { tried[w] = 1; recordFirstTry(TOOL, kind.id + ':' + w, ok, { unit: unit.id, mode: kind.label, id: w, why: ok ? '' : 'chose the card for ' + m }); }
  if (ok) {
    done[w] = ++pairNo; sel = null; draw();
    const left2 = round.filter(x => !done[x]).length;
    if (left2) say('<b>✓ ' + esc(w) + '</b> matches ' + describe(w) + '.');
    else finish();
  } else {
    draw();
    const btn = $('[data-m="' + CSS.escape(m) + '"]', colsEl); btn.classList.add('nope'); $('.mk', btn).textContent = '✗';
    const inRound = round.includes(m);
    say('<b>✗</b> That card ' + describe(m) + ' is for <b>' + esc(m) + '</b>' + (inRound ? '.' : ' — and “' + esc(m) + '” is not in this round.') + ' It does not match <b>' + esc(w) + '</b>.');
  }
}
function finish() {
  const st = Store.get(), t = dayKey(), mine = st.log.filter(e => e.tool === TOOL && e.d === t && e.unit === unit.id && round.includes(e.id)).slice(-round.length);
  const missed = round.filter(w => { const e = [...mine].reverse().find(x => x.id === w); return e && !e.ok; });
  say('<b>Round finished.</b> First try right: ' + (round.length - missed.length) + ' of ' + round.length + (missed.length ? '. Missed: ' + esc(missed.join(', ')) : '') + '. &nbsp; <a href="elkonin.html?unit=' + unit.id + '&clue=zh">Build these words in sound boxes →</a>');
}

const unitSel = $('#unit'); D.units.forEach(u => unitSel.append(h('option', { value: u.id }, u.title))); unitSel.value = unit.id;
unitSel.addEventListener('change', () => { unit = unitById(unitSel.value); allRounds = groups(); pairNo = 0; setRound(0); });
const kindBox = $('#kind');
KINDS.forEach(k => kindBox.append(h('button', { type: 'button', 'data-k': k.id, 'aria-pressed': String(k.id === kind.id), onclick: () => {
  kind = k; $$('button', kindBox).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k.id))); pairNo = 0; setRound(roundNo);
} }, k.label)));
$('#next').addEventListener('click', () => { pairNo = 0; setRound(roundNo + 1); });
$('#rep').addEventListener('click', () => report.open());
setRound(0);
</script>
</body>
</html>
