<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<!-- GENERATED by tools/build.py from src/rhyme.html + src/base.css + src/core.js + data/units.json.
     Edit those, not this file. -->
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhyming words</title>
<style>
{{BASE_CSS}}
.fam { display:flex; flex-wrap:wrap; gap:6px; }
.fam button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:4px 10px; min-height:40px; }
.fam button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
.stage { max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
.key { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.key .clue { min-width:240px; }
.rbx { width:44px; height:44px; flex:none; border:2px solid var(--boxink); margin-left:-2px; background:var(--clue); color:var(--boxink); font-size:1.35rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; }
.onset { width:84px; height:44px; flex:none; border:2px solid var(--boxink); background:var(--box); color:var(--boxink); font-size:1.35rem; font-weight:600; text-align:center; padding:0; margin:0; }
.onset.ok { border-color:var(--ok); border-width:3px; } .onset.bad { border-color:var(--bad); border-style:dashed; border-width:3px; }
.found h2 { font-size:.85rem; color:var(--muted); font-weight:600; margin:0 0 6px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border:2px solid var(--ok); background:var(--clue); border-radius:10px; padding:4px 12px; display:flex; gap:8px; align-items:center; }
.chip.shown { border-style:dotted; border-color:var(--muted); font-style:italic; }
.chip .cn { color:var(--muted); }
.qrow { display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:10px; align-items:center; padding:3px 0; }
.qrow .w { display:flex; gap:8px; align-items:center; font-size:1.3rem; font-weight:600; background:var(--clue); border-radius:6px; padding:4px 10px; min-height:46px; }
.qrow .ans { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.qrow .ans .btn { min-height:44px; }
.qrow .res { font-weight:700; }
.qrow.right .res { color:var(--ok); } .qrow.wrong .res { color:var(--bad); }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <a class="home" href="index.html">‹ All</a>
    <h1>Rhyming words</h1>
    <label>Unit <select id="unit"></select></label>
    <div class="seg" role="group" aria-label="Activity" id="task"></div>
    <div class="fam" id="fam" role="group" aria-label="Word ending"></div>
    <span class="grow"></span>
    <label id="tilesLbl"><input type="checkbox" id="tilesOn" checked> Letter tiles</label>
    <button class="btn" id="rep" type="button">Report</button>
  </div>
  <main>
    <div class="region"><div class="stage" id="stage"></div></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="tray" id="tray"><div class="tiles" id="tiles"></div></div>
    <div class="foot">Rhyme = the same ending sound. Saved on this device only.</div>
  </main>
</div>
<script>
{{DATA}}
</script>
<script>
{{CORE_JS}}
</script>
<script>
'use strict';
const TOOL = 'rhyme';
const TASKS = [{ id: 'make', label: 'Make rhymes' }, { id: 'judge', label: 'Rhyme or not?' }];
const qs = new URLSearchParams(location.search);
let unit = unitById(qs.get('unit')), task = TASKS.find(t => t.id === qs.get('task')) || TASKS[0], fam = null, tilesOn = true;
let found = [], shownAll = false, tried = {}, quiz = [];
const stage = $('#stage'), statusEl = $('#status'), tray = $('#tray'), tilesEl = $('#tiles'), famEl = $('#fam');
const report = reportDialog(TOOL, 'Rhyming words');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const say = html => statusEl.innerHTML = html;
const famsOf = u => D.rhymes.filter(r => r.unit === u.id);

function keyParts(f) {            // boxes of the key word after its starting sound(s)
  const parts = D.words[f.key].parts[0], onsetLen = f.key.length - f.rime.length; let n = 0, i = 0;
  while (n < onsetLen && i < parts.length) n += parts[i++].length;
  return { onset: parts.slice(0, i), rime: parts.slice(i) };
}
function keyCard(f) {
  const w = D.words[f.key];
  return h('div', { class: 'clue' }, h('span', { class: 'ic emo' }, w.icon), h('span', { class: 'en' }, f.key), h('span', { class: 'cn zh', lang: 'zh-HK' }, w.zh), speakBtn(f.key, 'Hear ' + f.key));
}

/* ---- make rhymes: change the start, keep the ending ---- */
function drawMake() {
  const f = fam, kp = keyParts(f), others = f.words.filter(w => w !== f.key);
  const inp = h('input', { class: 'onset', type: 'text', maxlength: '3', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Starting sound' });
  inp.addEventListener('input', () => { inp.value = inp.value.toLowerCase().replace(/[^a-z]/g, ''); inp.classList.remove('ok', 'bad'); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); attempt(inp); } });
  const row = h('div', { class: 'key' }, keyCard(f),
    h('div', { class: 'boxes', role: 'group', 'aria-label': 'Starting sound, then the ending' }, inp, ...kp.rime.map(g => h('span', { class: 'rbx', 'aria-hidden': 'false' }, g))),
    h('button', { class: 'btn pri', type: 'button', onclick: () => attempt(inp) }, 'Check'),
    h('button', { class: 'btn', type: 'button', onclick: () => { shownAll = true; drawMake(); say('The rest are shown in dotted boxes.'); } }, 'Show the rest'));
  const chips = h('div', { class: 'chips' });
  found.forEach(w => chips.append(chip(f, w, false)));
  if (shownAll) others.filter(w => !found.includes(w)).forEach(w => chips.append(chip(f, w, true)));
  stage.replaceChildren(row, h('div', { class: 'found' }, h('h2', {}, 'Rhymes with ' + f.key + ' — ' + found.length + ' found of ' + others.length), chips));
  inp.focus({ preventScroll: true }); stage._inp = inp;
}
function chip(f, w, shown) { return h('span', { class: 'chip' + (shown ? ' shown' : '') }, h('b', {}, w), h('span', { class: 'cn zh', lang: 'zh-HK' }, f.gloss[w] || ''), speakBtn(w, 'Hear ' + w)); }
const f0 = () => fam;
function attempt(inp) {
  let onset = inp.value.trim().toLowerCase();
  if (onset.endsWith(f0().rime)) onset = onset.slice(0, onset.length - f0().rime.length);   // typed the whole word: the ending is already in the boxes
  const f = fam, word = onset + f.rime, known = f.words.includes(word);
  if (word === f.key) { inp.classList.add('bad'); say('<b>That is the same word: ' + esc(word) + '.</b> Change the starting sound to make a different word.'); return; }
  if (!tried[word]) { tried[word] = 1; recordFirstTry(TOOL, 'make:' + word, known, { unit: unit.id, mode: 'Make rhymes', id: word, why: known ? '' : 'not in the word list' }); }
  if (known) {
    if (found.includes(word)) { say('You already found <b>' + esc(word) + '</b>.'); return; }
    found.push(word); inp.value = ''; drawMake();
    say('<b>✓ ' + esc(word) + '</b> rhymes with <b>' + esc(f.key) + '</b>. The ending <b>-' + esc(f.rime) + '</b> is the same; only the start changes.' + (f.gloss[word] ? ' &nbsp;<span class="zh" lang="zh-HK">' + esc(f.gloss[word]) + '</span>' : ''));
  } else {
    inp.classList.add('bad'); Say.en(word);
    say('<b>“' + esc(word) + '”</b> ends -' + esc(f.rime) + ', so it would rhyme with ' + esc(f.key) + '. It is not in my list of English words, so it is not counted. Check a dictionary, or try another start.');
  }
}

/* ---- rhyme or not: yes/no, with the near-misses that share a start or a last letter ---- */
function newQuiz() {
  const f = fam, yes = shuffle(f.words.filter(w => w !== f.key)).slice(0, 3).map(w => ({ w, yes: true })),
    no = shuffle(f.near).slice(0, 3).map(n => ({ w: n.w, yes: false, rime: n.rime }));
  quiz = shuffle(yes.concat(no)).map(q => Object.assign(q, { chosen: null, tries: 0 }));
}
function drawJudge() {
  const f = fam, rows = quiz.map((q, i) => {
    const r = h('div', { class: 'qrow' + (q.chosen != null && q.chosen === q.yes ? ' right' : '') , 'data-i': i },
      h('div', { class: 'w' }, h('span', {}, q.w), speakBtn(q.w, 'Hear ' + q.w)),
      h('div', { class: 'ans' },
        h('button', { class: 'btn', type: 'button', onclick: () => judge(i, true) }, 'Rhymes with ' + f.key),
        h('button', { class: 'btn', type: 'button', onclick: () => judge(i, false) }, 'Does not rhyme'),
        h('span', { class: 'res' }, q.chosen == null ? '' : (q.chosen === q.yes ? '✓ ' : '✗ ') + (q.yes ? 'rhymes' : 'does not rhyme'))));
    if (q.chosen != null && q.chosen !== q.yes) r.classList.add('wrong');
    return r;
  });
  stage.replaceChildren(h('div', { class: 'key' }, keyCard(f)), ...rows,
    h('div', {}, h('button', { class: 'btn', type: 'button', onclick: () => { newQuiz(); drawJudge(); say(''); } }, 'New words')));
}
function judge(i, said) {
  const f = fam, q = quiz[i]; q.tries++;
  if (q.tries === 1) recordFirstTry(TOOL, 'judge:' + q.w, said === q.yes, { unit: unit.id, mode: 'Rhyme or not?', id: q.w, why: said === q.yes ? '' : (q.yes ? 'said no to a rhyme' : 'said yes to ' + (q.w[0] === f.key[0] ? 'a word with the same start' : 'a near-miss')) });
  q.chosen = said; drawJudge();
  if (q.yes) say((said ? '<b>✓ ' : '<b>✗ ') + esc(q.w) + ' rhymes with ' + esc(f.key) + '.</b> &nbsp;' + esc(q.w) + ' ends -' + esc(f.rime) + '. ' + esc(f.key) + ' ends -' + esc(f.rime) + '. The endings are the same.');
  else {
    const extra = q.w[0] === f.key[0] ? ' Starting the same does not make a rhyme.' : (q.w.slice(-1) === f.rime.slice(-1) ? ' Only the last letter matches; the whole ending must match.' : '');
    say((said ? '<b>✗ ' : '<b>✓ ') + esc(q.w) + ' does not rhyme with ' + esc(f.key) + '.</b> &nbsp;' + esc(q.w) + ' ends -' + esc(q.rime) + '. ' + esc(f.key) + ' ends -' + esc(f.rime) + '. The endings are different.' + extra);
  }
}

/* ---- tiles: starting sounds only ---- */
function buildTiles() {
  const base = 'b c d f g h j k l m n p r s t w y z'.split(' '), onsets = [...new Set(D.rhymes.flatMap(r => r.words.map(w => w.slice(0, w.length - r.rime.length))))].filter(x => x.length > 1);
  const all = [...new Set(base.concat(onsets))].sort((a, b) => a.length - b.length || a.localeCompare(b));
  tilesEl.replaceChildren(...all.map(g => {
    const b = h('button', { class: 'tile', type: 'button', 'aria-label': 'Tile ' + g }, g); b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => { const i = stage._inp; if (i) { i.value = g; i.classList.remove('ok', 'bad'); i.focus({ preventScroll: true }); } });
    return b;
  }));
}
function applyTiles() { const on = tilesOn && task.id === 'make'; tray.hidden = !on; $('#tilesLbl').style.display = task.id === 'make' ? '' : 'none'; }

function setFam(id) {
  fam = D.rhymes.find(r => r.id === id); found = []; shownAll = false; tried = {};
  $$('button', famEl).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === id)));
  Clock.set(TOOL, unit.id); newQuiz(); say(''); draw();
}
function draw() { applyTiles(); if (task.id === 'make') drawMake(); else drawJudge(); }
function buildFams() {
  famEl.replaceChildren(...famsOf(unit).map(f => h('button', { type: 'button', 'data-f': f.id, 'aria-pressed': 'false', onclick: () => setFam(f.id) }, '-' + f.rime)));
}
const unitSel = $('#unit'); D.units.forEach(u => unitSel.append(h('option', { value: u.id }, u.title))); unitSel.value = unit.id;
unitSel.addEventListener('change', () => { unit = unitById(unitSel.value); buildFams(); setFam(famsOf(unit)[0].id); });
const taskBox = $('#task');
TASKS.forEach(t => taskBox.append(h('button', { type: 'button', 'data-t': t.id, 'aria-pressed': String(t.id === task.id), onclick: () => {
  task = t; $$('button', taskBox).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t.id))); say(''); draw();
} }, t.label)));
$('#tilesOn').addEventListener('change', e => { tilesOn = e.target.checked; applyTiles(); });
$('#rep').addEventListener('click', () => report.open());
buildTiles(); buildFams();
setFam((D.rhymes.find(r => r.id === qs.get('family') && r.unit === unit.id) || famsOf(unit)[0]).id);
</script>
</body>
</html>
